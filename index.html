<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Availability & Attendance Checker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #EDF1F7;
      --card-bg: #FFFFFF;
      --text-main: #0B132B;
      --text-body: #1E293B;
      --text-muted: #475569;
      --text-subtle: #64748B;
      --border-color: #E2E8F0;
      --indigo-accent: #6366F1;
      --focus-gradient: linear-gradient(135deg, #E0F2FE 0%, #EDE9FE 100%);
      --btn-gradient: linear-gradient(135deg, #1EA7FD 0%, #3B82F6 50%, #6D28D9 100%);
      --card-radius: 22px;
      --input-radius: 12px;
      --btn-radius: 12px;
      --card-shadow: 0 20px 45px -12px rgba(15, 23, 42, 0.12);
      --btn-shadow: 0 4px 14px 0 rgba(59, 130, 246, 0.35), 0 2px 4px rgba(109, 40, 217, 0.18);
      --btn-shadow-hover: 0 6px 20px 0 rgba(59, 130, 246, 0.45), 0 3px 8px rgba(109, 40, 217, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 400px;
      margin: auto;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: var(--card-radius);
      border: 1.5px solid #FFFFFF;
      box-shadow: var(--card-shadow);
      overflow: hidden;
      width: 100%;
    }

    .card-header {
      padding: 24px 22px 20px;
      text-align: center;
      background: linear-gradient(135deg, #DBEAFE 0%, #EDE9FE 100%);
      border-bottom: 1px solid rgba(226, 232, 240, 0.8);
    }

    .header-title-row {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 6px;
    }

    .card-header h1 {
      font-size: 24px;
      font-weight: 800;
      color: #0B132B;
      letter-spacing: -0.025em;
      line-height: 1.25;
      display: inline;
    }

    .badge-pill-new {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #BFDBFE;
      color: #1E3A8A;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 9999px;
      letter-spacing: 0.04em;
      line-height: 1.2;
      vertical-align: middle;
      box-shadow: 0 1px 2px rgba(30, 58, 138, 0.08);
    }

    .card-header p {
      font-size: 13.5px;
      color: #475569;
      font-weight: 500;
      line-height: 1.4;
    }

    .card-body {
      padding: 24px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 13.5px;
      font-weight: 600;
      color: #1E293B;
      margin-bottom: 7px;
      letter-spacing: -0.01em;
    }

    .select-wrapper {
      position: relative;
      height: 48px;
      border-radius: var(--input-radius);
      background: #FFFFFF;
      box-shadow: 0 2px 5px rgba(15, 23, 42, 0.04), 0 1px 2px rgba(15, 23, 42, 0.02);
    }

    .field-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 19px;
      height: 19px;
      pointer-events: none;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chevron-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      pointer-events: none;
      color: #64748B;
      z-index: 2;
    }

    select {
      width: 100%;
      height: 48px;
      padding: 12px 38px 12px 42px;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      color: #1E293B;
      background-color: #FFFFFF;
      border: 1.5px solid var(--border-color);
      border-radius: var(--input-radius);
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      cursor: pointer;
      outline: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    select:focus {
      background: var(--focus-gradient);
      border-color: var(--indigo-accent);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.16), 0 2px 6px rgba(99, 102, 241, 0.08);
    }

    select.is-invalid {
      border-color: #EF4444;
      background-color: #FEF2F2;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.14);
    }

    select:disabled {
      background-color: #F8FAFC;
      color: #94A3B8;
      cursor: not-allowed;
    }

    select option:disabled {
      color: #94A3B8;
      background-color: #F8FAFC;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 50px;
      padding: 0 20px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #FFFFFF;
      background: var(--btn-gradient);
      border: none;
      border-radius: var(--btn-radius);
      cursor: pointer;
      box-shadow: var(--btn-shadow);
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
      margin-top: 22px;
      outline: none;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1.5px);
      box-shadow: var(--btn-shadow-hover);
    }

    .btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .btn-chevron {
      font-size: 15px;
      line-height: 1;
      font-weight: 800;
      transition: transform 0.15s ease;
    }

    .btn:hover:not(:disabled) .btn-chevron {
      transform: translateX(2px);
    }

    .spinner {
      display: inline-block;
      width: 17px;
      height: 17px;
      border: 2.2px solid rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      border-top-color: #FFFFFF;
      animation: spin 0.7s linear infinite;
      margin-right: 4px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .alert {
      margin-top: 20px;
      padding: 16px;
      border-radius: 14px;
      font-size: 13.5px;
      border: 1.5px solid transparent;
      display: none;
      animation: fadeIn 0.25s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .alert-success {
      background-color: #F0FDF4;
      border-color: #BBF7D0;
      color: #166534;
    }

    .alert-danger {
      background-color: #FEF2F2;
      border-color: #FECACA;
      color: #991B1B;
    }

    .alert-warning {
      background-color: #FFFBEB;
      border-color: #FDE68A;
      color: #92400E;
    }

    .alert-title {
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .alert-details {
      font-size: 13px;
      line-height: 1.45;
    }

    .retry-link {
      display: inline-block;
      margin-top: 8px;
      font-size: 12.5px;
      font-weight: 600;
      color: #4F46E5;
      text-decoration: underline;
      cursor: pointer;
    }

    /* Separate status badges for Timetable and Attendance */
    .status-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin: 12px 0 10px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 10px;
      border: 1px solid rgba(0, 0, 0, 0.06);
    }

    .status-grid.dual-col {
      grid-template-columns: 1fr 1fr;
    }

    .status-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .status-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #475569;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      font-size: 12.5px;
      font-weight: 600;
      border-radius: 6px;
      width: fit-content;
    }

    .badge-success {
      background-color: #DCFCE7;
      color: #15803D;
    }

    .badge-danger {
      background-color: #FEE2E2;
      color: #B91C1C;
    }

    .badge-warning {
      background-color: #FEF3C7;
      color: #B45309;
    }

    .alert-message {
      font-size: 13.5px;
      margin-top: 6px;
      line-height: 1.45;
    }

    .footer-note {
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
      color: #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-weight: 500;
    }

    .footer-icon {
      width: 14px;
      height: 14px;
      color: #475569;
      display: inline-block;
    }
  </style>
</head>
<body>
  <!-- Shared gradient definitions for field icons -->
  <svg width="0" height="0" style="position: absolute; width: 0; height: 0; overflow: hidden;" aria-hidden="true">
    <defs>
      <linearGradient id="fieldIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#06B6D4" />
        <stop offset="50%" stop-color="#6366F1" />
        <stop offset="100%" stop-color="#EC4899" />
      </linearGradient>
    </defs>
  </svg>

  <div class="container">
    <div class="card">
      <div class="card-header">
        <div class="header-title-row">
          <h1>Teacher Availability & Attendance</h1>
          <span class="badge-pill-new">NEW</span>
        </div>
        <p>Check schedule and attendance availability</p>
      </div>

      <div class="card-body">
        <form id="availability-form" novalidate>
          <!-- Teacher Name Dropdown -->
          <div class="form-group">
            <label class="form-label" for="teacher-select">Teacher Name</label>
            <div class="select-wrapper">
              <span class="field-icon" aria-hidden="true">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="url(#fieldIconGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                  <circle cx="12" cy="7" r="4" />
                </svg>
              </span>
              <select id="teacher-select" name="name" required>
                <option value="">-- Loading teachers... --</option>
              </select>
              <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9" />
              </svg>
            </div>
          </div>

          <!-- Day Dropdown (Monday to Saturday, past days disabled) -->
          <div class="form-group">
            <label class="form-label" for="day-select">Day</label>
            <div class="select-wrapper">
              <span class="field-icon" aria-hidden="true">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="url(#fieldIconGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                  <line x1="16" y1="2" x2="16" y2="6" />
                  <line x1="8" y1="2" x2="8" y2="6" />
                  <line x1="3" y1="10" x2="21" y2="10" />
                </svg>
              </span>
              <select id="day-select" name="day" required>
                <option value="">-- Select Day --</option>
                <option value="mon">Monday</option>
                <option value="tues">Tuesday</option>
                <option value="wed">Wednesday</option>
                <option value="thurs">Thursday</option>
                <option value="fri">Friday</option>
                <option value="sat">Saturday</option>
              </select>
              <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9" />
              </svg>
            </div>
          </div>

          <!-- Period Dropdown (Seven timings supported by Go backend) -->
          <div class="form-group">
            <label class="form-label" for="period-select">Period</label>
            <div class="select-wrapper">
              <span class="field-icon" aria-hidden="true">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="url(#fieldIconGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10" />
                  <polyline points="12 6 12 12 16 14" />
                </svg>
              </span>
              <select id="period-select" name="period" required>
                <option value="">-- Select Period --</option>
                <option value="9:00-10:00">Period 1 (9:00-10:00)</option>
                <option value="10:00-10:50">Period 2 (10:00-10:50)</option>
                <option value="11:10-12:00">Period 3 (11:10-12:00)</option>
                <option value="12:00-1:00">Period 4 (12:00-1:00)</option>
                <option value="1:45-2:45">Period 5 (1:45-2:45)</option>
                <option value="2:45-3:45">Period 6 (2:45-3:45)</option>
                <option value="3:45-4:45">Period 7 (3:45-4:45)</option>
              </select>
              <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9" />
              </svg>
            </div>
          </div>

          <!-- Check Availability Button -->
          <button type="submit" id="check-btn" class="btn">
            CHECK AVAILABILITY <span class="btn-chevron">&gt;</span>
          </button>
        </form>

        <!-- Dynamic Result & Notification Area -->
        <div id="result-box" class="alert" role="alert" aria-live="polite"></div>
      </div>
    </div>
    <p class="footer-note">
      Powered by Svara-Bhaava
      <svg class="footer-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
    </p>
  </div>

  <script>
    const form = document.getElementById('availability-form');
    const teacherSelect = document.getElementById('teacher-select');
    const daySelect = document.getElementById('day-select');
    const periodSelect = document.getElementById('period-select');
    const checkBtn = document.getElementById('check-btn');
    const resultBox = document.getElementById('result-box');

    // Duplicate request prevention flag
    let isChecking = false;

    // Automatically resolve API target:
    // When served directly from Go (http://localhost:8080), use relative path.
    // If opened via file:// or another port (e.g. Live Server on 5500), target http://localhost:8080.
    const isLocalFile = window.location.protocol === 'file:';
    const isDifferentPort = window.location.port && window.location.port !== '8080';
    const API_BASE = (isLocalFile || isDifferentPort) ? 'http://localhost:8080' : '';

    // Clear alert message
    function clearMessage() {
      resultBox.className = 'alert';
      resultBox.innerHTML = '';
      resultBox.style.display = 'none';
    }

    // Generic alert message
    function showGenericMessage(title, message, type) {
      resultBox.className = 'alert alert-' + type;
      resultBox.style.display = 'block';
      resultBox.innerHTML = `
        <div class="alert-title">${title}</div>
        ${message ? `<div class="alert-details">${message}</div>` : ''}
      `;
      resultBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // Display result for TODAY with separate Timetable Status and Attendance Status
    function showTodayResult(overallTitle, timetableStatus, isClassScheduled, attendanceStatus, isTeacherPresent, message, type) {
      resultBox.className = 'alert alert-' + type;
      resultBox.style.display = 'block';

      const timetableBadgeClass = isClassScheduled ? 'badge-danger' : 'badge-success';
      const attendanceBadgeClass = attendanceStatus === 'Status Unknown' ? 'badge-warning' : (isTeacherPresent ? 'badge-success' : 'badge-danger');

      resultBox.innerHTML = `
        <div class="alert-title">${overallTitle}</div>
        <div class="status-grid dual-col">
          <div class="status-item">
            <span class="status-label">Timetable Status</span>
            <span class="status-badge ${timetableBadgeClass}">${timetableStatus}</span>
          </div>
          <div class="status-item">
            <span class="status-label">Attendance Status</span>
            <span class="status-badge ${attendanceBadgeClass}">${attendanceStatus}</span>
          </div>
        </div>
        <div class="alert-message">${message}</div>
      `;
      resultBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // Display result with separate Timetable Status and Attendance Status
    function showFutureResult(overallTitle, timetableStatus, isClassScheduled, message, type, attendanceStatus = 'Status Unknown', isTeacherPresent = null) {
      resultBox.className = 'alert alert-' + type;
      resultBox.style.display = 'block';

      const timetableBadgeClass = isClassScheduled ? 'badge-danger' : 'badge-success';
      const attendanceBadgeClass = attendanceStatus === 'Status Unknown' ? 'badge-warning' : (isTeacherPresent ? 'badge-success' : 'badge-danger');

      resultBox.innerHTML = `
        <div class="alert-title">${overallTitle}</div>
        <div class="status-grid dual-col">
          <div class="status-item">
            <span class="status-label">Timetable Status</span>
            <span class="status-badge ${timetableBadgeClass}">${timetableStatus}</span>
          </div>
          <div class="status-item">
            <span class="status-label">Attendance Status</span>
            <span class="status-badge ${attendanceBadgeClass}">${attendanceStatus}</span>
          </div>
        </div>
        <div class="alert-message">${message}</div>
      `;
      resultBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // Timetable period definitions with boundary timings (in minutes from midnight)
    const timetablePeriods = [
      { value: "9:00-10:00", label: "Period 1 (9:00-10:00)", startMin: 540, endMin: 600 },
      { value: "10:00-10:50", label: "Period 2 (10:00-10:50)", startMin: 600, endMin: 650 },
      { value: "11:10-12:00", label: "Period 3 (11:10-12:00)", startMin: 670, endMin: 720 },
      { value: "12:00-1:00", label: "Period 4 (12:00-1:00)", startMin: 720, endMin: 780 },
      { value: "1:45-2:45", label: "Period 5 (1:45-2:45)", startMin: 825, endMin: 885 },
      { value: "2:45-3:45", label: "Period 6 (2:45-3:45)", startMin: 885, endMin: 945 },
      { value: "3:45-4:45", label: "Period 7 (3:45-4:45)", startMin: 945, endMin: 1005 }
    ];

    // Updates period options based on the selected day:
    // When Today is selected: excludes completed periods, includes ongoing and future periods.
    // When a future day is selected: includes all periods.
    function updatePeriodDropdown() {
      const selectedOption = daySelect.options[daySelect.selectedIndex];
      const isToday = selectedOption && selectedOption.dataset.isToday === 'true';

      const now = new Date();
      const currentMin = now.getHours() * 60 + now.getMinutes();

      const prevSelectedPeriod = periodSelect.value;
      periodSelect.innerHTML = '<option value="">-- Select Period --</option>';

      if (isToday) {
        // Exclude completed (currentMin >= endMin)
        // Include ongoing (currentMin >= startMin && currentMin < endMin) and future (currentMin < startMin)
        const validPeriods = timetablePeriods.filter(p => currentMin < p.endMin);

        if (validPeriods.length === 0) {
          const opt = document.createElement('option');
          opt.value = "";
          opt.disabled = true;
          opt.textContent = "-- No periods available today --";
          periodSelect.appendChild(opt);
          daySelect.classList.add('is-invalid');
          showGenericMessage(
            'Invalid Date Selection',
            'All periods for today have completed. Please select a future day.',
            'warning'
          );
          return;
        }

        validPeriods.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p.value;
          opt.textContent = p.label;
          if (p.value === prevSelectedPeriod) {
            opt.selected = true;
          }
          periodSelect.appendChild(opt);
        });
      } else {
        timetablePeriods.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p.value;
          opt.textContent = p.label;
          if (p.value === prevSelectedPeriod) {
            opt.selected = true;
          }
          periodSelect.appendChild(opt);
        });
      }
    }

    // Helper to format local date YYYY-MM-DD without UTC / timezone shift
    function formatLocalDate(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    // Date selection initialization:
    // Dynamically determines current date, disables past days, and sets metadata for date comparisons.
    function setupDayDropdown() {
      const now = new Date();
      // Normalized today at midnight local time for accurate date comparison
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const currentDayOfWeek = now.getDay(); // 0 = Sunday, 1 = Mon, ..., 6 = Sat
      const currentMin = now.getHours() * 60 + now.getMinutes();

      const timetableDays = [
        { key: 'mon', name: 'Monday', dayIndex: 1 },
        { key: 'tues', name: 'Tuesday', dayIndex: 2 },
        { key: 'wed', name: 'Wednesday', dayIndex: 3 },
        { key: 'thurs', name: 'Thursday', dayIndex: 4 },
        { key: 'fri', name: 'Friday', dayIndex: 5 },
        { key: 'sat', name: 'Saturday', dayIndex: 6 }
      ];

      // Calculate Monday of the current schedule week
      // If today is Sunday (0), timetable schedule rolls into the upcoming Monday (+1 day)
      const diffToMonday = currentDayOfWeek === 0 ? 1 : 1 - currentDayOfWeek;
      const mondayDate = new Date(today);
      mondayDate.setDate(today.getDate() + diffToMonday);

      daySelect.innerHTML = '<option value="">-- Select Day --</option>';

      timetableDays.forEach(day => {
        const targetDate = new Date(mondayDate);
        targetDate.setDate(mondayDate.getDate() + (day.dayIndex - 1));

        // Use actual timestamp values for date comparison in local time
        const isPast = targetDate.getTime() < today.getTime();
        const isToday = targetDate.getTime() === today.getTime();
        const allCompletedToday = isToday && timetablePeriods.every(p => currentMin >= p.endMin);

        const opt = document.createElement('option');
        opt.value = day.key;
        opt.dataset.date = formatLocalDate(targetDate);
        opt.dataset.isToday = isToday ? 'true' : 'false';
        opt.dataset.isPast = isPast ? 'true' : 'false';
        opt.dataset.dayName = day.name;

        if (isPast || allCompletedToday) {
          opt.disabled = true;
          opt.textContent = isPast
            ? `${day.name} (Past - Not Selectable)`
            : `${day.name} (Today - All Periods Completed)`;
        } else if (isToday) {
          opt.textContent = `${day.name} (Today)`;
        } else {
          opt.textContent = `${day.name}`;
        }

        daySelect.appendChild(opt);
      });

      updatePeriodDropdown();
    }

    // Populate Teacher dropdown on page load with fallback and auto-retry
    let hasLoadedTeachers = false;
    async function loadTeachers(isAutoRetry = false) {
      if (hasLoadedTeachers) return;

      teacherSelect.disabled = true;
      teacherSelect.innerHTML = '<option value="">-- Loading teachers... --</option>';
      clearMessage();

      try {
        let response;
        try {
          response = await fetch(`${API_BASE}/teachers`);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
        } catch (e) {
          // Fallback to / with JSON Accept header
          response = await fetch(`${API_BASE}/`, {
            headers: { 'Accept': 'application/json' }
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
        }

        const teachers = await response.json();
        teacherSelect.innerHTML = '<option value="">-- Select Teacher --</option>';

        if (Array.isArray(teachers) && teachers.length > 0) {
          // Filter out empty/whitespace-only records and duplicates from the database
          const validTeachers = [...new Set(
            teachers
              .map(name => (typeof name === 'string' ? name.trim() : ''))
              .filter(name => name.length > 0)
          )];

          if (validTeachers.length > 0) {
            validTeachers.forEach(name => {
              const opt = document.createElement('option');
              opt.value = name;
              opt.textContent = name;
              teacherSelect.appendChild(opt);
            });
            hasLoadedTeachers = true;
          } else {
            teacherSelect.innerHTML = '<option value="">-- No teachers available --</option>';
            showGenericMessage(
              'No Teachers Found',
              'The database connected, but no valid teacher names were found.',
              'warning'
            );
          }
        } else {
          teacherSelect.innerHTML = '<option value="">-- No teachers available --</option>';
          showGenericMessage(
            'No Teachers Found',
            'The backend connected, but the database returned 0 teacher records.',
            'warning'
          );
        }
      } catch (err) {
        console.error('Error fetching teachers:', err);
        teacherSelect.innerHTML = '<option value="">-- Failed to load teachers --</option>';
        const hint = isLocalFile
          ? 'You opened this file directly from your disk (<code>file://</code>). Start your Go backend: <code>go run main.go</code>, then open <a href="http://localhost:8080" target="_blank">http://localhost:8080</a> in your browser.<br><span class="retry-link" onclick="loadTeachers()">Click here to retry loading</span>'
          : `Could not connect to the Go backend (${err.message || 'connection error'}). Ensure <code>go run main.go</code> is actively running in your terminal on port 8080.<br><span class="retry-link" onclick="loadTeachers()">Click here to retry loading</span>`;
        showGenericMessage('Connection Error', hint, 'warning');

        // Automatic retry once after 2.5 seconds in case backend was just spinning up
        if (!isAutoRetry) {
          setTimeout(() => {
            if (!hasLoadedTeachers) {
              loadTeachers(true);
            }
          }, 2500);
        }
      } finally {
        teacherSelect.disabled = false;
      }
    }

    // Allow clicking or focusing teacher dropdown to trigger reload if currently failed
    teacherSelect.addEventListener('focus', () => {
      if (!hasLoadedTeachers && teacherSelect.innerHTML.includes('Failed to load')) {
        loadTeachers();
      }
    });

    // Clear validation styling on selection change
    [teacherSelect, daySelect, periodSelect].forEach(select => {
      select.addEventListener('change', () => {
        if (select.value) {
          select.classList.remove('is-invalid');
        }
      });
    });
    daySelect.addEventListener('change', updatePeriodDropdown);

    // Handle Check Availability button click
    form.addEventListener('submit', async function (e) {
      e.preventDefault();

      // Prevent duplicate requests while a request is already processing
      if (isChecking) {
        return;
      }

      const teacherName = teacherSelect.value.trim();
      const day = daySelect.value.trim();
      const period = periodSelect.value.trim();

      // Reset invalid states
      teacherSelect.classList.remove('is-invalid');
      daySelect.classList.remove('is-invalid');
      periodSelect.classList.remove('is-invalid');

      // Validation
      let isValid = true;
      const missingFields = [];

      if (!teacherName) {
        teacherSelect.classList.add('is-invalid');
        missingFields.push('Teacher Name');
        isValid = false;
      }
      if (!day) {
        daySelect.classList.add('is-invalid');
        missingFields.push('Day');
        isValid = false;
      }
      if (!period) {
        periodSelect.classList.add('is-invalid');
        missingFields.push('Period');
        isValid = false;
      }

      if (!isValid) {
        showGenericMessage(
          'Missing Selection',
          `Please select: ${missingFields.join(', ')}.`,
          'warning'
        );
        return;
      }

      // Validate selected date using actual Date values (prevent past day submission)
      const selectedOption = daySelect.options[daySelect.selectedIndex];
      const isPast = selectedOption.dataset.isPast === 'true';
      const isToday = selectedOption.dataset.isToday === 'true';
      const now = new Date();
      const currentMin = now.getHours() * 60 + now.getMinutes();

      if (isPast) {
        daySelect.classList.add('is-invalid');
        showGenericMessage(
          'Invalid Date Selection',
          'Past days cannot be selected. Please choose Today or a Future day.',
          'warning'
        );
        return;
      }

      // If Today is selected, validate that ongoing or future periods are available
      if (isToday) {
        const allCompletedToday = timetablePeriods.every(p => currentMin >= p.endMin);
        if (allCompletedToday) {
          daySelect.classList.add('is-invalid');
          showGenericMessage(
            'Invalid Date Selection',
            'All periods for today have completed. Please select a future day.',
            'warning'
          );
          return;
        }

        const selectedPeriodObj = timetablePeriods.find(p => p.value === period);
        if (selectedPeriodObj && currentMin >= selectedPeriodObj.endMin) {
          periodSelect.classList.add('is-invalid');
          showGenericMessage(
            'Invalid Period Selection',
            'This period has already ended. Please select an ongoing or upcoming period.',
            'warning'
          );
          return;
        }
      }
      const dayName = selectedOption.dataset.dayName || selectedOption.text;

      isChecking = true;
      checkBtn.disabled = true;
      checkBtn.innerHTML = '<span class="spinner"></span> CHECKING AVAILABILITY...';

      try {
        const queryParams = new URLSearchParams({
          name: teacherName,
          day: day,
          period: period,
          isToday: isToday ? 'true' : 'false'
        });

        const res = await fetch(`${API_BASE}/check?${queryParams.toString()}`);
        if (!res.ok) {
          throw new Error(`Server returned HTTP ${res.status}`);
        }

        const data = await res.json();

        // Interpret backend response:
        // Handles structured response { isAccepted, isPresent } or fallback boolean
        let isAccepted = false;
        let isPresent = null;

        if (typeof data === 'boolean') {
          isAccepted = data;
        } else if (typeof data === 'object' && data !== null) {
          isAccepted = data.isAccepted ?? data.IsAccepted ?? false;
          if ('isPresent' in data || 'IsPresent' in data) {
            isPresent = data.isPresent ?? data.IsPresent ?? false;
          }
        }

        if (isToday) {
          // --- RESULT LOGIC FOR TODAY ---
          // Both Timetable Status and Attendance Status are displayed
          // IsAccepted: true = Class Scheduled, false = No Class Scheduled
          // IsPresent: true = Present, false = Absent

          if (isPresent === null) {
            // Backend returned a single boolean without separate attendance
            if (isAccepted) {
              showTodayResult(
                '✕ Not Available',
                'Class Scheduled',
                true,
                'Status Unknown',
                false,
                `The teacher has a scheduled class during this period.`,
                'danger'
              );
            } else {
              showTodayResult(
                '✓ Available',
                'No Class Scheduled',
                false,
                'Status Unknown',
                true,
                `The teacher has no scheduled class during this period.`,
                'success'
              );
            }
          } else if (isAccepted === true && isPresent === true) {
            // Case 1: IsAccepted = true AND IsPresent = true
            showTodayResult(
              '✕ Not Available',
              'Class Scheduled',
              true,
              'Present',
              true,
              'The teacher has a scheduled class during this period and is present.',
              'danger'
            );
          } else if (isAccepted === true && isPresent === false) {
            // Case 2: IsAccepted = true AND IsPresent = false
            showTodayResult(
              '✕ Not Available',
              'Class Scheduled',
              true,
              'Absent',
              false,
              'The teacher has a scheduled class during this period but is absent.',
              'danger'
            );
          } else if (isAccepted === false && isPresent === true) {
            // Case 3: IsAccepted = false AND IsPresent = true
            showTodayResult(
              '✓ Available',
              'No Class Scheduled',
              false,
              'Present',
              true,
              'The teacher has no scheduled class during this period and is present.',
              'success'
            );
          } else {
            // Case 4: IsAccepted = false AND IsPresent = false
            showTodayResult(
              '⚠ Available but Absent',
              'No Class Scheduled',
              false,
              'Absent',
              false,
              'The teacher has no scheduled class during this period, but the teacher is absent.',
              'warning'
            );
          }
        } else {
          // --- RESULT LOGIC FOR FUTURE DAYS ---
          // Display both Timetable Status and Attendance Status side-by-side
          let attendanceStatus = 'Status Unknown';
          let isTeacherPresent = isPresent;
          if (isPresent === true) {
            attendanceStatus = 'Present';
          } else if (isPresent === false) {
            attendanceStatus = 'Absent';
          }

          if (isAccepted === true) {
            // Case 1: IsAccepted = true
            showFutureResult(
              '✕ Not Available',
              'Class Scheduled',
              true,
              'The teacher has a scheduled class during this period.',
              'danger',
              attendanceStatus,
              isTeacherPresent
            );
          } else {
            // Case 2: IsAccepted = false
            showFutureResult(
              '✓ Available',
              'No Class Scheduled',
              false,
              'The teacher has no scheduled class during this period.',
              'success',
              attendanceStatus,
              isTeacherPresent
            );
          }
        }
      } catch (error) {
        console.error('Check failed:', error);
        showGenericMessage(
          'Error Checking Availability',
          `Could not verify availability due to a server or database error (${error.message || 'connection failed'}). Please check your backend connection.`,
          'danger'
        );
      } finally {
        isChecking = false;
        checkBtn.disabled = false;
        checkBtn.innerHTML = 'CHECK AVAILABILITY <span class="btn-chevron">&gt;</span>';
      }
    });

    // Initialize day options with dynamic date evaluation and teacher list
    setupDayDropdown();
    loadTeachers();
  </script>
</body>
</html>
